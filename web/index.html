
<!DOCTYPE html>
<html>
<head>
    <title>My Personal Profile</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f3fa;
            margin: 0;
            padding: 35px 20px;
            color: #333;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #6545a5;
            margin: 0;
            font-size: 26px;
        }

        .header p {
            color: #777;
            font-size: 14px;
            margin-top: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 5px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 9px;
            color: #49376d;
        }

        input, textarea {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #e2dced;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            background: #fcfbff;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #8060c5;
            background: white;
            box-shadow: 0 0 0 3px rgba(128, 96, 197, 0.12);
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        button {
             width: 100%;
             padding: 13px;
             margin-top: 20px;
             background: #6545a5;
             color: white;
             border: none;
             border-radius: 7px;
             cursor: pointer;
             font-size: 15px;
         }

        button:hover {
             background: #503584;
         }

        .footer {
            text-align: center;
            color: #aaa2b7;
            font-size: 12px;
            margin-top: 25px;
        }

        /* Responsive design */
        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .container {
                padding: 25px 20px;
                border-radius: 16px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            h1 {
                font-size: 24px;
            }

            .full-width {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">

            <h1>My Personal Profile</h1>

            <p>
                Create your profile and tell us more about yourself.
            </p>
        </div>

        <form action="ProfileServlet" method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label>👤 Full Name</label>
                    <input type="text" name="name"
                           placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label>🎓 Student ID</label>
                    <input type="text" name="studentId"
                           placeholder="Enter your student ID" required>
                </div>

                <div class="form-group">
                    <label>📚 Program</label>
                    <input type="text" name="program"
                           placeholder="Enter your program" required>
                </div>

                <div class="form-group">
                    <label>✉️ Email Address</label>
                    <input type="email" name="email"
                           placeholder="Enter your email" required>
                </div>

                <div class="form-group full-width">
                    <label>💜 Hobbies & Interests</label>
                    <input type="text" name="hobbies"
                           placeholder="e.g. Reading, Travelling, Music">
                </div>

                <div class="form-group full-width">
                    <label>✨ Short Self-Introduction</label>
                    <textarea name="introduction"
                        placeholder="Tell us something interesting about yourself..."></textarea>
                </div>

            </div>

            <button type="submit">
                Submit My Profile →
            </button>

        </form>

        <div class="footer">
            Personal Profile Web Application
        </div>

    </div>

</body>
</html>
